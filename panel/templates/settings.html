<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKE-UI - Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <header class="navbar">
            <div class="brand">
                <h1 class="brand-title">IKE-UI</h1>
                <span class="brand-badge">v{{ app_version }}</span>
            </div>

            <div class="nav-actions">
                <a href="https://github.com/MehranPNG/IKE-UI" target="_blank" rel="noopener noreferrer" class="btn-github" title="GitHub Repository">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    <span class="github-stars">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" class="star-icon">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span id="ghStarsCount">--</span>
                    </span>
                </a>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-icon" title="Dashboard" aria-label="Dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline btn-icon" title="Logout" aria-label="Logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </a>
            </div>
        </header>

        <main class="main-content" style="max-width: 580px; margin: 2.5rem auto;">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card settings-card">
                <div class="card-header">
                    <h2>Change Admin Password</h2>
                    <p>Update credentials for panel security</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('settings') }}">
                        <div class="form-group">
                            <label>Current Password</label>
                            <input type="password" name="current_password" required placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" name="new_password" required placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" name="confirm_password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Update Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function fetchGitHubStars() {
            const starEl = document.getElementById('ghStarsCount');
            if (!starEl) return;
            const cached = localStorage.getItem('ike_ui_gh_stars');
            const cachedTime = localStorage.getItem('ike_ui_gh_stars_time');
            if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < 3600000) {
                starEl.textContent = cached;
                return;
            }
            fetch('https://api.github.com/repos/MehranPNG/IKE-UI')
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data && typeof data.stargazers_count !== 'undefined') {
                        const count = data.stargazers_count;
                        starEl.textContent = count;
                        localStorage.setItem('ike_ui_gh_stars', count);
                        localStorage.setItem('ike_ui_gh_stars_time', Date.now());
                    } else if (!cached) {
                        starEl.textContent = '★';
                    }
                })
                .catch(() => {
                    if (!cached) starEl.textContent = '★';
                });
        }

        document.addEventListener('DOMContentLoaded', fetchGitHubStars);
    </script>
</body>
</html>
